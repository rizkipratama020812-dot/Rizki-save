<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Loading Screen</title>
<style>
  * { box-sizing: border-box; }
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100svh;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: #050505;
    color: #fff;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .screen {
    width: min(100%, 560px);
    min-height: 100svh;
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    isolation: isolate;
  }
  .glow {
    position: absolute;
    width: min(76vw, 390px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: #fff;
    opacity: .055;
    filter: blur(65px);
    animation: glowPulse 2.8s ease-in-out infinite;
    z-index: -1;
  }
  .logo-wrap {
    width: min(70vw, 250px);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    opacity: 0;
    transform: translateY(12px) scale(.88);
    animation: logoIn .9s cubic-bezier(.2,.8,.2,1) .15s forwards, float 3s ease-in-out 1.1s infinite;
  }
  .logo {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 8px;
    filter: drop-shadow(0 8px 28px rgba(255,255,255,.08));
  }
  .loading-copy {
    margin-top: 4px;
    text-align: center;
    opacity: 0;
    animation: fadeIn .7s ease-out .7s forwards;
  }
  .loading-copy h1 {
    margin: 0;
    font-size: 12px;
    font-weight: 650;
    letter-spacing: .28em;
    text-transform: uppercase;
  }
  .loading-copy p {
    margin: 10px 0 0;
    color: #929292;
    font-size: 13px;
    letter-spacing: .02em;
  }
  .progress {
    width: min(64vw, 220px);
    height: 3px;
    margin-top: 28px;
    overflow: hidden;
    background: #292929;
    border-radius: 99px;
    opacity: 0;
    animation: fadeIn .5s ease-out .9s forwards;
  }
  .progress-bar {
    height: 100%;
    width: 38%;
    border-radius: inherit;
    background: #fff;
    animation: progressMove 1.55s cubic-bezier(.65,0,.35,1) .95s infinite;
  }
  .dots {
    display: inline-block;
    width: 22px;
    text-align: left;
  }
  .dots::after {
    content: "";
    animation: dots 1.2s steps(4, end) infinite;
  }
  .footer {
    position: absolute;
    bottom: max(24px, env(safe-area-inset-bottom));
    color: #555;
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeIn .7s ease-out 1.2s forwards;
  }
  @keyframes logoIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes float {
    0%, 100% { translate: 0 0; }
    50% { translate: 0 -5px; }
  }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes glowPulse {
    0%, 100% { transform: scale(.9); opacity: .035; }
    50% { transform: scale(1.08); opacity: .075; }
  }
  @keyframes progressMove {
    0% { transform: translateX(-130%); }
    100% { transform: translateX(360%); }
  }
  @keyframes dots {
    0% { content: ""; }
    25% { content: "."; }
    50% { content: ".."; }
    75%, 100% { content: "..."; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
